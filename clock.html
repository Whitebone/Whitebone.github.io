<!DOCTYPE html>
<html>
<head>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: sans-serif; overflow: hidden; }
        #clockCanvas { max-width: 90vw; max-height: 70vh; aspect-ratio: 1 / 1; }
        button { margin-top: 20px; padding: 15px 30px; font-size: 20px; cursor: pointer; }
        #timeDisplay { margin-top: 20px; font-size: 32px; font-weight: bold; visibility: hidden; }
    </style>
</head>
<body>

<canvas id="clockCanvas" width="600" height="600"></canvas>

<button id="mainBtn" onclick="handleButtonClick()">New Time / Reveal</button>
<div id="timeDisplay">00:00</div>

<script>
    const canvas = document.getElementById('clockCanvas');
    const ctx = canvas.getContext('2d');
    const timeDisplay = document.getElementById('timeDisplay');
    let currentH, currentM;

    function drawClock() {
        const size = canvas.width;
        const center = size / 2;
        ctx.clearRect(0, 0, size, size);
        
        // Draw Ticks
        for (let i = 0; i < 60; i++) {
            const angle = (i * 6 - 90) * (Math.PI / 180);
            const isHour = i % 5 === 0;
            const startDist = size * 0.43;
            const endDist = isHour ? size * 0.48 : size * 0.46;
            
            ctx.beginPath();
            ctx.lineWidth = isHour ? size / 100 : size / 300;
            ctx.moveTo(center + startDist * Math.cos(angle), center + startDist * Math.sin(angle));
            ctx.lineTo(center + endDist * Math.cos(angle), center + endDist * Math.sin(angle));
            ctx.stroke();
        }

        // Draw Hands
        drawHand((currentH % 12) * 30 + currentM * 0.5, size * 0.25, size / 60); // Hour
        drawHand(currentM * 6, size * 0.38, size / 100); // Minute
    }

    function drawHand(deg, length, width) {
        const center = canvas.width / 2;
        const angle = (deg - 90) * (Math.PI / 180);
        ctx.beginPath();
        ctx.lineWidth = width;
        ctx.lineCap = 'round';
        ctx.moveTo(center, center);
        ctx.lineTo(center + length * Math.cos(angle), center + length * Math.sin(angle));
        ctx.stroke();
    }

    function handleButtonClick() {
        if (timeDisplay.style.visibility === 'visible') {
            timeDisplay.style.visibility = 'hidden';
            currentH = Math.floor(Math.random() * 12) + 1;
            currentM = Math.floor(Math.random() * 60);
            timeDisplay.innerText = `${currentH}:${currentM.toString().padStart(2, '0')}`;
            drawClock();
        } else {
            timeDisplay.style.visibility = 'visible';
        }
    }

    // Initial setup
    currentH = Math.floor(Math.random() * 12) + 1;
    currentM = Math.floor(Math.random() * 60);
    timeDisplay.innerText = `${currentH}:${currentM.toString().padStart(2, '0')}`;
    drawClock();
</script>
</body>
</html>
