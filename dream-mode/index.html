<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dream Mode Schedule</title>

    <!-- Google Fonts Embed -->
    <link href="https://fonts.googleapis.com/css2?family=Solway:wght@300;400;500;700;800&display=swap" rel="stylesheet">

    <!-- Styles -->
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="../Global/topbar/topbar.css"> <!-- Topbar styles -->

    <!-- Favicon -->
    <link rel="icon" type="image/x-icon" href="https://raw.githubusercontent.com/Whitebone/dream-mode/refs/heads/main/favicon.ico">
</head>
<body>
    <!-- Topbar placeholder -->
    <header id="topbar-placeholder"></header>

    <div class="container">
        <div id="mode-info" class="mode-info">
            <p class="current-mode solway-extrabold">Loading...</p>
            <p class="next-mode solway-medium">Next Mode:</p>
            <p class="countdown solway-regular">Countdown...</p>
        </div>
        <div id="schedule" class="schedule">
            <ul id="schedule-list"></ul>
        </div>
    </div>

    <!-- Scripts -->
    <script>
        // Load the topbar
        document.addEventListener('DOMContentLoaded', function() {
            fetch('../Global/topbar/topbar.html')
                .then(response => response.text())
                .then(data => {
                    document.getElementById('topbar-placeholder').innerHTML = data;
                })
                .catch(error => console.error('Error fetching topbar:', error));
        });
    </script>
    <script src="script.js"></script>
</body>
</html>
